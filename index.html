<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Daybook</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Mrs+Saint+Delafield&family=Young+Serif&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#1E5B57">
<style>
:root{--bg:#E9EEE8;--card:#F7F9F5;--ink:#1D2B2A;--muted:#5E6F6C;--accent:#1E5B57;--on:#F7F9F5;--gold:#B7821F;--line:#CBD6CF;--danger:#A33A2E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121B1A;--card:#1B2726;--ink:#E4ECE8;--muted:#8FA39E;--accent:#5FB3A8;--on:#0F1716;--gold:#E0B04F;--line:#2B3B39;--danger:#E27D70}}
:root[data-theme="dark"]{--bg:#121B1A;--card:#1B2726;--ink:#E4ECE8;--muted:#8FA39E;--accent:#5FB3A8;--on:#0F1716;--gold:#E0B04F;--line:#2B3B39;--danger:#E27D70}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'DM Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:720px;margin:0 auto;padding:12px 14px 84px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
h1{font:400 34px/1.1 'Young Serif',Georgia,serif;margin:0}
.date{color:var(--muted);font-size:14px;margin-top:4px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.add{background:var(--accent);color:var(--on);border:0;border-radius:999px;padding:10px 18px;font-weight:700}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:150px;resize:vertical}
.search{margin-bottom:6px}
.row{padding:16px 0;border-bottom:1px solid var(--line)}
.row h3{font:400 20px/1.25 'Young Serif',Georgia,serif;margin:0 0 4px}
.row p{margin:0;color:var(--muted);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:13px;color:var(--muted);margin-top:6px}
.tap{cursor:pointer}
.empty{color:var(--muted);padding:40px 0;text-align:center}
.habit{display:flex;gap:14px;align-items:center}
.check{flex:none;width:54px;height:54px;border-radius:50%;border:2px solid var(--accent);background:transparent;font-size:24px;color:var(--on)}
.check.on{background:var(--accent)}
.hb{flex:1;min-width:0}
.hb b{display:block;font-size:18px}
.streak{color:var(--gold);font-weight:700;font-size:14px}
.week{display:flex;gap:6px;margin-top:8px}
.day{width:26px;text-align:center;font-size:11px;color:var(--muted);background:none;border:0;padding:0}
.day i{display:block;width:18px;height:18px;margin:2px auto 0;border-radius:50%;border:1.5px solid var(--line)}
.day.on i{background:var(--gold);border-color:var(--gold)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar span{display:block;height:100%;background:var(--accent)}
.bar.done span{background:var(--gold)}
.small{border:1px solid var(--line);background:none;border-radius:8px;padding:5px 12px;font-size:14px;margin-right:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;padding:10px 0;font-size:15px;color:var(--muted);border-radius:10px}
nav button.on{color:var(--accent);font-weight:700}
.seg{display:flex;gap:6px;margin:0 0 12px}
.seg button{flex:1;border:1px solid var(--line);background:none;border-radius:999px;padding:8px 0;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:120px;overflow:hidden}
.gc h3{font:400 17px/1.25 'Young Serif',Georgia,serif;margin:0 0 6px}
.gc p{margin:0;color:var(--muted);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.nr{padding-left:12px}
.rd{white-space:pre-wrap;max-height:50vh;overflow:auto;padding-left:12px;margin-top:6px}
.cls{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.check.sm{width:38px;height:38px;font-size:18px}
.dn{text-decoration:line-through;color:var(--muted);font-weight:400}
.ch{font:400 24px/1.2 'Young Serif',Georgia,serif;margin:14px 0 0}
.addc{display:flex;gap:8px;margin-top:14px}
.cls .del{padding:6px 10px}
.tb{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tbb{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 11px;font-size:15px;min-width:38px}
.ed{min-height:150px;max-height:40vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.ed:focus-visible{outline:2px solid var(--accent)}
.rd h3,.ed h3{font:400 19px 'Young Serif',Georgia,serif;margin:8px 0 4px}
.rd ul,.ed ul{margin:6px 0;padding-left:22px}
.hr{display:flex;gap:8px;align-items:center}
.ib{border:1px solid var(--line);background:none;border-radius:999px;width:42px;height:40px;font-size:20px;line-height:1}
.full{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
.nvt{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.nvt .sp{flex:1}
.nvb{flex:1;overflow:auto;padding:14px 16px}
.nti{font:400 26px/1.2 'Young Serif',Georgia,serif;border:0;background:none;padding:6px 0;width:100%;color:var(--ink);border-radius:0}
.ed2{min-height:55vh;outline:0;font-size:17px;line-height:1.6;padding:6px 0;word-wrap:break-word}
.ed2 h3{font:400 21px 'Young Serif',Georgia,serif;margin:10px 0 4px}
.ed2 ul{padding-left:22px}
.ntools{border-top:1px solid var(--line);background:var(--card);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.trow{display:flex;gap:6px;overflow-x:auto}
.trow .tbb{flex:none}
.pal{display:flex;gap:10px;flex-wrap:wrap;padding:6px 4px 10px}
.pal button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0}
.tbb.on{background:var(--accent);color:var(--on);border-color:var(--accent);box-shadow:0 0 0 2px var(--gold)}
.ed2 img,.rd img{max-width:100%;height:auto;border-radius:8px;display:block;margin:8px 0}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.swb{width:34px;height:34px;border-radius:50%;border:2px solid transparent;padding:0}
.swb.on{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--bg)}
.by{display:flex;gap:8px;align-items:baseline;justify-content:center;margin-top:10px}
.ab{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.sig{font-family:'Mrs Saint Delafield','Segoe Script','Brush Script MT',cursive;font-size:21px;line-height:1;color:var(--gold)}
#cv{display:block;width:100%;height:calc(100dvh - 350px);min-height:300px;touch-action:none;background:var(--card);border:1px solid var(--line);border-radius:14px}
.gbar{display:flex;align-items:center;gap:12px;margin-top:12px}
dialog{border:0;border-radius:16px;background:var(--bg);color:var(--ink);width:min(92vw,520px);padding:20px}
dialog{max-height:92dvh;overflow:auto}
.xb{position:sticky;top:0;float:right;z-index:3;width:34px;height:34px;margin:-8px -8px 0 6px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:16px;line-height:1;padding:0}
dialog.big{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;border-radius:0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{font:400 24px 'Young Serif',Georgia,serif;margin:0 0 12px}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
.acts{display:flex;gap:10px;margin-top:18px;align-items:center}
.acts .sp{flex:1}
.del{background:none;border:0;color:var(--danger);padding:8px}
.cancel{background:none;border:1px solid var(--line);border-radius:999px;padding:10px 16px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="nv" class="full" hidden></div>
<dialog id="dlg"><button class="xb" onclick="dlg.close()" aria-label="Close">✕</button><div id="dbody"></div></dialog>
<script>
const $=s=>document.querySelector(s);
let S={notes:[],habits:[],books:[]},tab='notes',q='';
try{const r=localStorage.getItem('daybook');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
let DB=null,sv=0,sd=0;
const warn=()=>{if(!warn.w){warn.w=1;alert('Storage problem: new changes may NOT be saved. Save a backup file now.')}};
const save=()=>{
  if(!DB){try{localStorage.setItem('daybook',JSON.stringify(S))}catch(e){warn()}return}
  if(sv){sd=1;return}sv=1;
  const t=DB.transaction('kv','readwrite');t.objectStore('kv').put(JSON.stringify(S),'S');
  t.oncomplete=()=>{sv=0;if(sd){sd=0;save()}else try{localStorage.removeItem('daybook')}catch(e){}};
  t.onerror=t.onabort=()=>{sv=0;warn()};
};
async function idbInit(){
  try{
    DB=await new Promise((res,rej)=>{const r=indexedDB.open('daybook',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('img'))d.createObjectStore('img')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
    const g=DB.transaction('kv').objectStore('kv').get('S'),v=await new Promise((r,j)=>{g.onsuccess=()=>r(g.result);g.onerror=()=>j(g.error)});
    if(v)S=Object.assign({notes:[],habits:[],books:[]},JSON.parse(v));else save();
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  }catch(e){DB=null}
  S.courses=S.courses||[];S.trash=S.trash||[];S.folders=S.folders||[];render();setTimeout(imgGC,3000);
}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const streak=h=>{let d=new Date(),n=0;if(!h.done.includes(key(d)))d.setDate(d.getDate()-1);while(h.done.includes(key(d))){n++;d.setDate(d.getDate()-1)}return n};
const K=()=>tab=='gears'?'notes':tab;
const TABS={notes:['Notes','Notes'],habits:['Habits','Habits'],books:['Books','Books'],courses:['Courses','Courses']};
const ADD={notes:'New note',gears:'New note',habits:'New habit',books:'New book',courses:'New course'};

function render(){
  $('#nav').innerHTML=Object.keys(TABS).map(t=>`<button class="${t==tab?'on':''}" onclick="go('${t}')">${TABS[t][0]}</button>`).join('');
  const today=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
  let h=`<header><div><h1>${TABS[tab][1]}</h1><div class="date">${today}</div></div><div class="hr"><button class="ib" onclick="bkOpen()" aria-label="Backup and restore">⋯</button>${tab=='courses'&&cur?'':`<button class="add" onclick="edit()">+ ${ADD[tab].split(' ')[1]}</button>`}</div></header>`;
  if(tab=='notes')h+=segHtml()+chipsHtml();
  if(tab=='notes'&&view()!='gears')h+=`<input class="search" placeholder="Search notes" value="${esc(q)}" oninput="q=this.value;list()" aria-label="Search notes">`;
  $('#app').innerHTML=h+'<div id="list"></div>'+SIG;list();
}
function list(){
  let h='';
  if(tab=='courses'){coursesView();return}
  if(tab=='notes'&&view()=='gears'&&vis().length){gearsView();return}
  if(tab=='notes'){
    const n=vis().filter(x=>(x.t+' '+x.b).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.u-a.u);
    h=notesHtml(n);
    if(!h)h=`<div class="empty">${q?'No notes match your search.':'No notes yet. Tap + Note to write your first one.'}</div>`;
    if(vis().length>50&&(S.view||'gears')=='gears')h='<div class="meta">You have more than 50 notes, so they show as a normal list.</div>'+h;
  }else if(tab=='habits'){
    const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d});
    h=S.habits.map(x=>{const t=key(new Date()),on=x.done.includes(t);
      return `<div class="row habit"><button class="check ${on?'on':''}" onclick="tog('${x.id}','${t}')" aria-label="Mark ${esc(x.n)} done today">${on?'✓':''}</button><div class="hb"><b class="tap" onclick="edit('${x.id}')">${esc(x.n)}</b><span class="streak">${streak(x)} day streak</span><div class="week">${days.map(d=>`<button class="day ${x.done.includes(key(d))?'on':''}" onclick="tog('${x.id}','${key(d)}')" aria-label="${d.toDateString()}">${d.toLocaleDateString(undefined,{weekday:'narrow'})}<i></i></button>`).join('')}</div></div></div>`}).join('');
    if(!h)h='<div class="empty">No habits yet. Tap + Habit and pick one small thing to repeat daily.</div>';
  }else{
    h=S.books.map(x=>{const p=x.pages>0?Math.min(100,Math.round(x.read/x.pages*100)):0,fin=x.pages>0&&x.read>=x.pages;
      return `<div class="row"><h3 class="tap" onclick="edit('${x.id}')">${esc(x.t)}</h3><div class="meta" style="margin:0">${esc(x.a||'Unknown author')}</div><div class="bar ${fin?'done':''}"><span style="width:${p}%"></span></div><div class="meta" style="margin:0 0 8px">${fin?'Finished':`Page ${x.read} of ${x.pages||'?'} · ${p}%`}</div><button class="small" onclick="pg('${x.id}',-10)">−10</button><button class="small" onclick="pg('${x.id}',10)">+10 pages</button></div>`}).join('');
    if(!h)h='<div class="empty">No books yet. Tap + Book to add what you are reading.</div>';
  }
  $('#list').innerHTML=h;
}
function go(t){tab=t;q='';cur=null;render();scrollTo(0,0)}
function tog(id,d){const x=S.habits.find(h=>h.id==id),i=x.done.indexOf(d);i>=0?x.done.splice(i,1):x.done.push(d);save();list()}
function pg(id,n){const x=S.books.find(b=>b.id==id);x.read=Math.max(0,x.read+n);if(x.pages>0)x.read=Math.min(x.read,x.pages);save();list()}

function edit(id){
  if(K()=='notes'){noteOpen(id,!id);return}
  const tab=K(),c=tab=='notes'?S.notes:tab=='habits'?S.habits:tab=='courses'?S.courses:S.books,x=id?c.find(i=>i.id==id):null;
  let f='';ek=x&&x.k!=null?x.k:null;
  if(tab=='notes')f=`<label for="f1">Title</label><input id="f1" value="${esc(x&&x.t)}"><label for="f2">Note</label><div class="tb">${[['bold','<b>B</b>'],['italic','<i>I</i>'],['underline','<u>U</u>'],['strikeThrough','<s>S</s>'],['insertUnorderedList','• List'],['formatBlock:h3','Heading'],['removeFormat','Clear']].map(a=>`<button class="tbb" data-c="${a[0]}" onpointerdown="event.preventDefault()" onclick="fmt('${a[0]}')">${a[1]}</button>`).join('')}</div><div id="f2" class="ed" contenteditable="true">${x?(x.h||esc(x.b).replace(/\n/g,'<br>')):''}</div><label>Colour</label><div class="sw">${NC.map((c,i)=>`<button class="swb ${i==ek?'on':''}" style="background:${c}" onclick="pick(${i})" aria-label="Colour ${i+1}"></button>`).join('')}</div>`;
  if(tab=='courses')f=`<label for="f1">Course name</label><input id="f1" placeholder="Python for beginners" value="${esc(x&&x.n)}">`;
  if(tab=='habits')f=`<label for="f1">Habit name</label><input id="f1" placeholder="Read 20 minutes" value="${esc(x&&x.n)}">`;
  if(tab=='books')f=`<label for="f1">Title</label><input id="f1" value="${esc(x&&x.t)}"><label for="f2">Author</label><input id="f2" value="${esc(x&&x.a)}"><label for="f3">Total pages</label><input id="f3" type="number" inputmode="numeric" min="0" value="${x?x.pages:''}"><label for="f4">Pages read</label><input id="f4" type="number" inputmode="numeric" min="0" value="${x?x.read:0}">`;
  $('#dbody').innerHTML=`<h2>${x?'Edit':ADD[tab]}</h2>${f}<div class="acts">${x?`<button class="del" onclick="rm('${x.id}')">Delete</button>`:''}<span class="sp"></span><button class="cancel" onclick="dlg.close()">Cancel</button><button class="add" onclick="ok('${x?x.id:''}')">Save</button></div>`;
  if(!dlg.open)dlg.showModal();setTimeout(()=>{const e=$(id&&tab=='notes'?'#f2':'#f1');e&&e.focus()},50);
}
function ok(id){
  const tab=K(),v=n=>{const e=$('#f'+n);return e?(e.value!==undefined?e.value:e.innerText):''};
  if(!v(1).trim()&&!v(2).trim()){dlg.close();return}
  if(tab=='courses'){let x=S.courses.find(i=>i.id==id);if(!x){x={id:uid(),cl:[]};S.courses.push(x)}x.n=v(1).trim();save();dlg.close();render();return}
  if(tab=='notes'){let x=S.notes.find(i=>i.id==id);if(!x){x={id:uid()};S.notes.push(x)}x.t=v(1).trim();x.b=v(2);x.h=clean($('#f2').innerHTML);x.u=Date.now();x.k=ek}
  if(tab=='habits'){if(!v(1).trim())return;let x=S.habits.find(i=>i.id==id);if(!x){x={id:uid(),done:[]};S.habits.push(x)}x.n=v(1).trim()}
  if(tab=='books'){if(!v(1).trim())return;let x=S.books.find(i=>i.id==id);if(!x){x={id:uid()};S.books.push(x)}x.t=v(1).trim();x.a=v(2).trim();x.pages=Math.max(0,+v(3)||0);x.read=Math.max(0,+v(4)||0)}
  save();dlg.close();render()
}
function rm(id){confirmDlg('Delete this? This cannot be undone.','Delete',()=>rm2(id))}
function rm2(id){
  const tab=K();
  if(tab=='notes'){const n=S.notes.find(i=>i.id==id);if(n){n.dt=Date.now();S.trash.push(n);while(S.trash.length>5)S.trash.shift()}}S[tab]=S[tab].filter(i=>i.id!=id);if(tab=='courses')cur=null;save();dlg.close();render()
}
const MOD=3,A=MOD*.55,D=MOD*.7,GAP=6,GC=['#D99A1E','#B8453A','#2F7F73','#3A5F78','#7A5C8E','#4F7F3A','#C2410C','#0E7490','#9D174D','#475569'],GT=['#1D2B2A','#fff','#fff','#fff','#fff','#fff','#fff','#fff','#fff','#fff'];
let G=[],gphi=0,gomega=0,gdrag=null,graf=0,glast=0,gv={s:1,ox:0,oy:0};
function layout(){
  G=vis().map((n,i)=>{const N=Math.max(10,Math.min(30,10+Math.floor(((n.t||'').length+(n.b||'').length)/25)));return{n,N,r:N*MOD/2,x:0,y:0,a0:0,s:1,c:(n.k==null?i%6:n.k)}});
  for(let i=1;i<G.length;i++){
    const g=G[i];let best=null,bd=1e9;
    for(let j=0;j<i;j++){const p=G[j];
      for(let k=0;k<24;k++){const th=i*2.4+k*Math.PI/12,d=p.r+g.r,x=p.x+d*Math.cos(th),y=p.y+d*Math.sin(th);
        if(G.slice(0,i).every((o,m)=>m==j||Math.hypot(x-o.x,y-o.y)>=o.r+g.r+GAP)){const dd=Math.hypot(x,y);if(dd<bd){bd=dd;best={p,th,x,y}}}}}
    if(!best){g.x=i*120;continue}
    const p=best.p,th=best.th;g.x=best.x;g.y=best.y;g.s=-p.s;
    const p1=2*Math.PI/p.N,p2=2*Math.PI/g.N,f1=(((th-p.a0)/p1)%1+1)%1;
    g.a0=th+Math.PI-(.5-f1)*p2;
  }
}
function fit(c){
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;

async function dk(pin,salt){const m=await crypto.subtle.importKey('raw',TE.encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(k,t){const iv=crypto.getRandomValues(new Uint8Array(12));return{iv:b64(iv),ct:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,TE.encode(t)))}}
async function unseal(k,o){return TD.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.iv)},k,ub(o.ct)))}
let LK=null;
document.addEventListener('visibilitychange',()=>{if(document.hidden)LK=null});
function needKey(){return new Promise(res=>{
  const has=!!S.pk;
  $('#dbody').innerHTML=`<h2>${has?'Enter your PIN':'Create a PIN'}</h2><input id="pin1" type="password" inputmode="numeric" autocomplete="off" placeholder="4 or more digits">${has?'':'<label for="pin2">Repeat PIN</label><input id="pin2" type="password" inputmode="numeric" autocomplete="off">'}<div class="meta" id="pinm" style="margin-top:8px">${has?'':'If you forget this PIN, locked notes cannot be opened. There is no reset.'}</div><div class="acts"><span class="sp"></span><button class="cancel" onclick="dlg.close()">Cancel</button><button class="add" id="pinok">OK</button></div>`;
  dlg.addEventListener('close',()=>res(!!LK),{once:true});
  $('#pinok').onclick=async()=>{
    const p=$('#pin1').value,m=$('#pinm');
    if(p.length<4){m.textContent='Use at least 4 digits.';return}
    if(has){try{const k=await dk(p,ub(S.pk.s));if(await unseal(k,S.pk)!='ok')throw 0;LK=k;dlg.close()}catch(e){m.textContent='Wrong PIN.'}}
    else{if(p!=$('#pin2').value){m.textContent='The PINs do not match.';return}
      const sl=crypto.getRandomValues(new Uint8Array(16)),k=await dk(p,sl);S.pk=Object.assign({s:b64(sl)},await seal(k,'ok'));save();LK=k;dlg.close()}
  };
  dlg.showModal();setTimeout(()=>$('#pin1').focus(),50);
})}
async function noteSave(){
  if(!nd)return;
  const t=$('#nt').value.trim(),b=$('#nb'),pl=b.innerText.trim();
  if(!t&&!pl&&!nid)return;
  let x=nid&&S.notes.find(n=>n.id==nid);
  if(!x){x={id:uid(),f:S.fl&&S.fl!='all'&&S.fl!='arch'?S.fl:null};S.notes.push(x);nid=x.id}
  const d={t,b:b.innerText,h:clean(b.innerHTML,x.lk?'i':0)};
  if(x.lk){if(!LK)await needKey();if(!LK)return;x.enc=await seal(LK,JSON.stringify(d));x.t='';x.b='';x.h=''}
  else{x.t=d.t;x.b=d.b;x.h=await imgPack(d.h)}
  x.k=nk;x.u=Date.now();save();nd=false;
}
async function noteMenu(){
  await noteSave();const x=nid&&S.notes.find(n=>n.id==nid);if(!x)return;
  const F=S.folders.map(f=>`<button class="small" onclick="setNF('${f.id}')">${x.f==f.id?'✓ ':''}${esc(f.n)}</button>`).join('');
  $('#dbody').innerHTML=`<h2>Note options</h2><button class="cancel" style="width:100%;margin-bottom:8px" onclick="toggleLock()">${x.lk?'Remove lock':'Lock with PIN'}</button><button class="cancel" style="width:100%;margin-bottom:8px" onclick="toggleArchive()">${x.a?'Move out of Archive':'Archive'}</button><label>Folder</label><div class="chips" style="flex-wrap:wrap"><button class="small" onclick="setNF(null)">${x.f?'':'✓ '}No folder</button>${F}</div><div class="acts"><button class="del" onclick="dlg.close();noteDel()">Delete</button><span class="sp"></span><button class="cancel" onclick="dlg.close()">Close</button></div>`;
  dlg.showModal();
}
function setNF(f){const x=S.notes.find(n=>n.id==nid);if(x){x.f=f;save()}dlg.close()}
function toggleArchive(){const x=S.notes.find(n=>n.id==nid);if(!x)return;x.a=!x.a;nd=false;save();dlg.close();noteClose()}
async function toggleLock(){
  const x=S.notes.find(n=>n.id==nid);if(!x)return;
  dlg.close();await new Promise(r=>setTimeout(r,60));
  if(!LK)await needKey();if(!LK)return;
  if(x.lk){const d=JSON.parse(await unseal(LK,x.enc));x.t=d.t;x.b=d.b;x.h=await imgPack(clean(d.h));x.lk=false;delete x.enc;nd=false;save()}
  else{const d={t:$('#nt').value.trim(),b:$('#nb').innerText,h:clean($('#nb').innerHTML,'i')};x.enc=await seal(LK,JSON.stringify(d));x.t='';x.b='';x.h='';x.lk=true;nd=false;save();noteClose()}
}
function noteDel(){
  if(!nid){nd=false;noteClose();return}
  confirmDlg('Move this note to Recently deleted?','Delete',()=>{const i=S.notes.findIndex(n=>n.id==nid);if(i<0)return;const n=S.notes.splice(i,1)[0];n.dt=Date.now();S.trash.push(n);while(S.trash.length>5)S.trash.shift();nd=false;save();noteClose()});
}
function trashOpen(){
  $('#dbody').innerHTML=`<h2>Recently deleted</h2><div class="meta" style="margin:0 0 8px">Keeps your last 5 deleted notes. When a sixth arrives, the oldest is gone for good.</div>${S.trash.map((n,i)=>`<div class="cls"><div class="hb"><b>${n.lk?'🔒 Locked note':esc(n.t||'Untitled')}</b><div class="meta" style="margin:0">${new Date(n.dt).toLocaleDateString()}</div></div><button class="small" onclick="trRestore(${i})">Restore</button><button class="del" onclick="trKill(${i})">Delete</button></div>`).join('')||'<div class="empty">Nothing here.</div>'}<div class="acts"><span class="sp"></span><button class="cancel" onclick="dlg.close()">Close</button></div>`;
  if(!dlg.open)dlg.showModal();
}
function trRestore(i){const n=S.trash.splice(i,1)[0];delete n.dt;S.notes.push(n);save();trashOpen();render()}
function trKill(i){confirmDlg('Delete this note for good? This cannot be undone.','Delete',()=>{S.trash.splice(i,1);save();trashOpen()})}
let CR=null;
function imgPick(){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>cropOpen(im);im.onerror=()=>alert('Could not open that picture.');im.src=URL.createObjectURL(f)};i.click()}
function cropOpen(im){
  const s=Math.min(1,Math.min(innerWidth*.8,460)/im.width,innerHeight*.45/im.height),w=Math.round(im.width*s),h=Math.round(im.height*s);
  CR={im,s,w,h,x:0,y:0,cw:w,ch:h,r:0,m:null};
  $('#dbody').innerHTML=`<h2>Crop picture</h2><canvas id="cc" width="${w}" height="${h}" style="display:block;margin:0 auto;max-width:100%;touch-action:none;border-radius:8px"></canvas><div class="meta" style="margin-top:6px">Drag the box to move it. Drag the bottom-right corner to resize.</div><div class="chips" style="margin-top:8px">${[['Free',0],['1:1',1],['4:3',4/3],['16:9',16/9]].map(a=>`<button class="chip" onclick="cropAr(${a[1]})">${a[0]}</button>`).join('')}</div><div class="acts"><button class="cancel" onclick="dlg.close()">Cancel</button><span class="sp"></span><button class="add" onclick="cropOk()">Insert</button></div>`;
  dlg.showModal();cropBind();cropDraw();
}
function cropAr(r){let c=CR;c.r=r;if(r){let w=c.w,h=w/r;if(h>c.h){h=c.h;w=h*r}c.cw=w;c.ch=h;c.x=(c.w-w)/2;c.y=(c.h-h)/2}cropDraw()}
function cropDraw(){const c=CR,x=$('#cc').getContext('2d');x.clearRect(0,0,c.w,c.h);x.drawImage(c.im,0,0,c.w,c.h);
  x.fillStyle='rgba(0,0,0,.5)';x.fillRect(0,0,c.w,c.y);x.fillRect(0,c.y+c.ch,c.w,c.h);x.fillRect(0,c.y,c.x,c.ch);x.fillRect(c.x+c.cw,c.y,c.w,c.ch);
  x.strokeStyle='#fff';x.lineWidth=2;x.strokeRect(c.x,c.y,c.cw,c.ch);x.fillStyle='#fff';x.fillRect(c.x+c.cw-10,c.y+c.ch-10,14,14)}
function cropBind(){const cv=$('#cc'),c=CR;
  const P=e=>{const r=cv.getBoundingClientRect(),k=c.w/r.width;return[(e.clientX-r.left)*k,(e.clientY-r.top)*k]};
  cv.onpointerdown=e=>{const[px,py]=P(e);cv.setPointerCapture(e.pointerId);
    if(Math.hypot(px-(c.x+c.cw),py-(c.y+c.ch))<30)c.m={t:'r'};
    else if(px>=c.x&&px<=c.x+c.cw&&py>=c.y&&py<=c.y+c.ch)c.m={t:'m',dx:px-c.x,dy:py-c.y}};
  cv.onpointermove=e=>{if(!c.m)return;const[px,py]=P(e);
    if(c.m.t=='m'){c.x=Math.max(0,Math.min(c.w-c.cw,px-c.m.dx));c.y=Math.max(0,Math.min(c.h-c.ch,py-c.m.dy))}
    else{let w=Math.max(40,Math.min(c.w-c.x,px-c.x)),h=c.r?w/c.r:Math.max(40,Math.min(c.h-c.y,py-c.y));
      if(c.r&&c.y+h>c.h){h=c.h-c.y;w=h*c.r}c.cw=w;c.ch=h}
    cropDraw()};
  cv.onpointerup=cv.onpointercancel=()=>{c.m=null}}
function cropOk(){const c=CR,k=1/c.s,sw=c.cw*k,sh=c.ch*k,m=Math.min(1,1000/Math.max(sw,sh)),o=document.createElement('canvas');
  o.width=Math.round(sw*m);o.height=Math.round(sh*m);o.getContext('2d').drawImage(c.im,c.x*k,c.y*k,sw,sh,0,0,o.width,o.height);
  const u=o.toDataURL('image/jpeg',.8);URL.revokeObjectURL(c.im.src);CR=null;dlg.close();
  setTimeout(()=>{ef();document.execCommand('insertHTML',false,`<img src="${u}"><br>`);nd=true},60)}
let PT=null;
function paintOpen(){
  const w=Math.round(innerWidth-30);PT={c:'#1D2B2A',s:4,hist:[]};
  $('#dbody').innerHTML=`<h2>Paint</h2><canvas id="pc" width="${w}" height="${Math.max(240,Math.round(innerHeight-250))}" style="display:block;margin:0 auto;max-width:100%;touch-action:none;background:#fff;border-radius:8px;border:1px solid var(--line)"></canvas><div class="sw" style="margin-top:10px">${['#1D2B2A','#B8453A','#D97706','#2F7F73','#2563EB','#7A5C8E','#DB2777','#FFFFFF'].map((c,i)=>`<button class="swb ${i==0?'on':''}" style="background:${c};outline:1px solid var(--line)" onclick="paintCol('${c}',this)" aria-label="${c=='#FFFFFF'?'Eraser':'Colour '+(i+1)}"></button>`).join('')}</div><div class="hr" style="margin-top:10px"><label style="margin:0">Size</label><input type="range" min="1" max="24" value="4" oninput="PT.s=+this.value"></div><div class="acts"><button class="small" onclick="paintUndo()">Undo</button><button class="small" onclick="paintClr()">Clear</button><span class="sp"></span><button class="cancel" onclick="dlg.close()">Cancel</button><button class="add" onclick="paintOk()">Insert</button></div>`;
  dlg.classList.add('big');dlg.showModal();paintBind();
}
function paintCol(c,b){PT.c=c;document.querySelectorAll('#dbody .swb').forEach(x=>x.classList.toggle('on',x==b))}
function paintSnap(){const cv=$('#pc');PT.hist.push(cv.getContext('2d').getImageData(0,0,cv.width,cv.height));if(PT.hist.length>15)PT.hist.shift()}
function paintUndo(){const cv=$('#pc'),h=PT.hist.pop();if(h)cv.getContext('2d').putImageData(h,0,0)}
function paintClr(){const cv=$('#pc'),x=cv.getContext('2d');paintSnap();x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height)}
function paintBind(){
  const cv=$('#pc'),x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.lineCap=x.lineJoin='round';
  const P=e=>{const r=cv.getBoundingClientRect(),k=cv.width/r.width;return[(e.clientX-r.left)*k,(e.clientY-r.top)*k]};
  let l=null;
  const seg=(a,b)=>{x.strokeStyle=PT.c;x.lineWidth=PT.s;x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke()};
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);paintSnap();l=P(e);seg(l,[l[0]+.01,l[1]])};
  cv.onpointermove=e=>{if(!l)return;const p=P(e);seg(l,p);l=p};
  cv.onpointerup=cv.onpointercancel=()=>{l=null};
}
function paintOk(){const u=$('#pc').toDataURL('image/png');PT=null;dlg.close();setTimeout(()=>{ef();document.execCommand('insertHTML',false,`<img src="${u}"><br>`);nd=true},60)}
const imgPut=(k,v)=>new Promise((res,rej)=>{const t=DB.transaction('img','readwrite');t.objectStore('img').put(v,k);t.oncomplete=res;t.onerror=t.onabort=()=>rej(t.error)});
const imgGet=k=>new Promise(res=>{if(!DB)return res(null);const q=DB.transaction('img').objectStore('img').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)});
async function imgPack(h){
  if(!DB)return h;
  const t=document.createElement('template');t.innerHTML=h;
  for(const i of t.content.querySelectorAll('img')){
    if(i.getAttribute('data-i')){i.removeAttribute('src');continue}
    const u=i.getAttribute('src');if(!u)continue;
    const id=uid();try{await imgPut(id,u)}catch(e){continue}
    i.setAttribute('data-i',id);i.removeAttribute('src');
  }
  return t.innerHTML;
}
async function imgFill(r){for(const i of r.querySelectorAll('img[data-i]')){if(i.getAttribute('src'))continue;const u=await imgGet(i.getAttribute('data-i'));if(u)i.src=u;else i.alt='(picture missing)'}}
async function imgPutAll(o){if(!DB||!o)return;for(const k of Object.keys(o))if(/^[a-z0-9]{3,30}$/.test(k)&&/^data:image\//.test(o[k]))await imgPut(k,o[k])}
async function imgGC(){
  if(!DB)return;
  const all=[...S.notes,...S.trash].map(n=>n.h||'').join('\n');
  const ks=await new Promise(r=>{const q=DB.transaction('img').objectStore('img').getAllKeys();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])});
  const dead=ks.filter(k=>!all.includes(k));if(!dead.length)return;
  const t=DB.transaction('img','readwrite');dead.forEach(k=>t.objectStore('img').delete(k));
}
function usage(){try{navigator.storage.estimate().then(e=>setTimeout(()=>{const u=$('#usg');if(u)u.textContent='Storage used: '+(e.usage/1048576).toFixed(1)+' MB'},80))}catch(x){}}
